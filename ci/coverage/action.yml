name: coverage
description: "Stage 4: merge shard coverage and run jest-coverage (SV:208-252)."
inputs:
  node_version_file: {"default": ".nvmrc"}
  github_packages_token: {"required": true}
  npmjs_token: {"required": true}
runs:
  using: composite
  steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with: {"persist-credentials": false}
    - uses: OsomePteLtd/actions/ci/setup-node@v1
      with:
        node_version_file: ${{ inputs.node_version_file }}
        github_packages_token: ${{ inputs.github_packages_token }}
        npmjs_token: ${{ inputs.npmjs_token }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: coverage-artifacts-*
        path: coverage
        merge-multiple: true
    - uses: OsomePteLtd/actions/packages/jest-coverage@v1
      with:
        coverage-directory: ./coverage/
        summary-destination: ./coverage/coverage-summary.json
