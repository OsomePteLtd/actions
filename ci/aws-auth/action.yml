name: aws-auth
description: Assume an AWS role via OIDC. Role ARN is always an input; this public repo holds no account IDs.
inputs:
  role_arn: {"description": "Role to assume (pass from caller vars)", "required": true}
  region: {"description": "AWS region", "default": "us-east-1"}
runs:
  using: composite
  steps:
    - name: Require role
      shell: bash
      env: {"ROLE": "${{ inputs.role_arn }}"}
      run: '[ -n "$ROLE" ] || { echo "::error::role_arn is empty (set vars.CI_ROLE_ARN in the caller repo)"; exit 1; }'
    - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6
      with:
        role-to-assume: ${{ inputs.role_arn }}
        role-session-name: ${{ github.repository_id }}
        aws-region: ${{ inputs.region }}
