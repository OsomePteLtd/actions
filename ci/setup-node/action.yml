name: setup-node
description: .nvmrc -> setup-node -> registry auth -> install. Replaces the block repeated in shiva default.yml:68-87,178-192,224-238 and deploy.yml:198-212.
inputs:
  node_version_file: {"description": "Node version file", "default": ".nvmrc"}
  package_manager: {"description": "npm | pnpm (pnpm version comes from package.json packageManager)", "default": "npm"}
  install:
    description: "ci = npm ci | guard = npm install + fail if package-lock.json changes (SV:78-87, SC:89-98) | none. pnpm: ci and guard both run pnpm install --frozen-lockfile, which already fails on a stale lockfile"
    default: ci
  cache: {"description": "setup-node cache ('' disables; any other value caches for package_manager)", "default": "npm"}
  github_packages_token: {"description": "Token for npm.pkg.github.com (OSOME_BOT_TOKEN)", "required": true}
  npmjs_token: {"description": "Read-only npmjs token (NPMJS_KEY_READ_ONLY)", "required": true}
runs:
  using: composite
  steps:
    - name: Check package manager
      shell: bash
      env: {"PM": "${{ inputs.package_manager }}"}
      run: |
        case "$PM" in npm|pnpm) ;; *) echo "::error::package_manager must be npm or pnpm, got '$PM'"; exit 1 ;; esac
    # before setup-node: its pnpm cache needs the pnpm binary
    - if: inputs.package_manager == 'pnpm'
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version-file: ${{ inputs.node_version_file }}
        cache: ${{ inputs.cache != '' && inputs.package_manager || '' }}
    - name: Registry auth
      shell: bash
      env:
        GH_PKG_TOKEN: ${{ inputs.github_packages_token }}
        NPMJS_TOKEN: ${{ inputs.npmjs_token }}
      run: |
        printf '//npm.pkg.github.com/:_authToken=%s\n' "$GH_PKG_TOKEN" >> ~/.npmrc
        printf '//registry.npmjs.org/:_authToken=%s\n' "$NPMJS_TOKEN" >> ~/.npmrc
        # user-level scope too: serverless-webpack runs a nested npm install in .webpack/
        # without the repo .npmrc, so @osomepteltd would hit registry.npmjs.org (jamal)
        printf '@osomepteltd:registry=https://npm.pkg.github.com\n' >> ~/.npmrc
    - name: Install (${{ inputs.install }})
      if: inputs.install != 'none'
      shell: bash
      env:
        MODE: ${{ inputs.install }}
        PM: ${{ inputs.package_manager }}
      run: |
        if [ "$PM" = pnpm ]; then
          pnpm install --frozen-lockfile
        elif [ "$MODE" = guard ]; then
          cp package-lock.json package-lock.json.orig
          npm install
          if ! diff --color=always package-lock.json.orig package-lock.json; then
            echo "::error::package-lock.json changed, failing build"; exit 1
          fi
        else
          npm ci
        fi
