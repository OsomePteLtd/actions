name: deploy-trigger
description: "Stage 5: create a GitHub deployment record; the repo's on: deployment workflow ships it (SV:254-275, SC:210-227)."
inputs:
  stage: {"required": true}
  token: {"description": "OSOME_BOT_TOKEN (GITHUB_TOKEN events do not trigger workflows)", "required": true}
runs:
  using: composite
  steps:
    - uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8 # v1.5.0
      with:
        step: start
        token: ${{ inputs.token }}
        env: ${{ inputs.stage }}
        ref: ${{ github.head_ref || github.ref_name }}
        override: true
