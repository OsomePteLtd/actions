name: tests
description: "Stage 3: one test shard (SV:165-206, SC:158-184). Services are declared by the skeleton job."
inputs:
  shard: {"required": true}
  shards: {"required": true}
  pre_test_scripts: {"description": "Whitespace-separated npm scripts run before migrate. '' skips", "default": ""}
  extra_checkout_repo: {"description": "owner/repo checked out before pre_test_scripts. '' skips", "default": ""}
  extra_checkout_ref: {"description": "'' = default branch of extra_checkout_repo", "default": ""}
  extra_checkout_path: {"description": "Workspace-relative directory for extra_checkout_repo", "default": ".extra-checkout"}
  extra_checkout_token: {"description": "Read token for extra_checkout_repo (pass a secret); '' = github.token", "default": ""}
  extra_pre_test_scripts: {"description": "npm scripts run in extra_checkout_path after its npm ci. '' skips install and scripts", "default": ""}
  migrate_script: {"description": "'' skips", "default": "db:migrate:test"}
  test_script: {"default": "test:ci"}
  coverage: {"description": "Upload coverage-final.json as coverage-artifacts-<shard>", "default": "true"}
  role_arn: {"required": true}
  aws_region: {"default": "us-east-1"}
  node_version_file: {"default": ".nvmrc"}
  package_manager: {"description": "npm | pnpm", "default": "npm"}
  github_packages_token: {"required": true}
  npmjs_token: {"required": true}
runs:
  using: composite
  steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with: {"persist-credentials": false}
    - uses: OsomePteLtd/actions/ci/aws-auth@master
      with: {"role_arn": "${{ inputs.role_arn }}", "region": "${{ inputs.aws_region }}"}
    - uses: OsomePteLtd/actions/ci/setup-node@master
      with:
        node_version_file: ${{ inputs.node_version_file }}
        package_manager: ${{ inputs.package_manager }}
        github_packages_token: ${{ inputs.github_packages_token }}
        npmjs_token: ${{ inputs.npmjs_token }}
    - name: Check extra checkout inputs
      if: inputs.extra_checkout_repo != ''
      shell: bash
      env: {"REPO": "${{ inputs.extra_checkout_repo }}", "DIR": "${{ inputs.extra_checkout_path }}"}
      run: |
        [[ "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::extra_checkout_repo must be owner/repo, got '$REPO'"; exit 1; }
        # a subdirectory of the workspace only: never the caller's own checkout, never outside it
        [[ "$DIR" =~ ^[A-Za-z0-9_.][A-Za-z0-9_./-]*$ && ! "$DIR" =~ (^|/)\.\.?(/|$) ]] || { echo "::error::extra_checkout_path must be a relative subdirectory, got '$DIR'"; exit 1; }
    - name: Check out ${{ inputs.extra_checkout_repo }}
      if: inputs.extra_checkout_repo != ''
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        repository: ${{ inputs.extra_checkout_repo }}
        ref: ${{ inputs.extra_checkout_ref }}
        path: ${{ inputs.extra_checkout_path }}
        token: ${{ inputs.extra_checkout_token || github.token }}
        persist-credentials: false
    - name: Prepare ${{ inputs.extra_checkout_repo }}
      if: inputs.extra_checkout_repo != '' && inputs.extra_pre_test_scripts != ''
      shell: bash
      working-directory: ${{ inputs.extra_checkout_path }}
      env: {"S": "${{ inputs.extra_pre_test_scripts }}"}
      run: |
        # same node and ~/.npmrc as the caller (setup-node above)
        npm ci
        for s in $S; do npm run "$s"; done
    - name: Pre-test scripts
      if: inputs.pre_test_scripts != ''
      shell: bash
      env: {"S": "${{ inputs.pre_test_scripts }}"}
      run: for s in $S; do npm run "$s"; done
    - name: Migrate test DB
      if: inputs.migrate_script != ''
      shell: bash
      env: {"S": "${{ inputs.migrate_script }}"}
      run: npm run "$S"
    - name: Run tests (shard ${{ inputs.shard }}/${{ inputs.shards }})
      shell: bash
      env: {"S": "${{ inputs.test_script }}", "N": "${{ inputs.shard }}", "T": "${{ inputs.shards }}"}
      run: |
        # single shard: no --shard flag, same as scrooge SC:184
        if [ "$T" = 1 ]; then npm run "$S"; else npm run "$S" -- --shard="$N/$T"; fi
    - name: Move coverage
      if: inputs.coverage == 'true'
      shell: bash
      env: {"N": "${{ inputs.shard }}"}
      run: mv coverage/coverage-final.json "coverage/$N.json"
    - if: inputs.coverage == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-artifacts-${{ inputs.shard }}
        path: coverage/
        retention-days: 3
