name: checks
description: "Stage 2: migration guard, lockfile guard, static scripts, IAM wildcard check, bundle build (SV:52-119, SC:69-115)."
inputs:
  static_scripts: {"description": "Whitespace-separated npm scripts run in order", "required": true}
  build_script: {"description": "npm script for the bundle ('' skips)", "default": "build"}
  lockfile_guard: {"default": "true"}
  iam_check: {"default": "true"}
  migration_guard: {"default": "true"}
  serverless_license: {"description": "Read /ServerlessFramework/license from SSM before build", "default": "true"}
  role_arn: {"required": true}
  aws_region: {"default": "us-east-1"}
  node_version_file: {"default": ".nvmrc"}
  github_packages_token: {"required": true}
  npmjs_token: {"required": true}
runs:
  using: composite
  steps:
    - name: Fail on code + migrations in one PR
      if: inputs.migration_guard == 'true' && github.event_name == 'pull_request'
      uses: OsomePteLtd/actions/packages/fail-on-code-and-migrations@v1
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with: {"persist-credentials": false}
    - uses: OsomePteLtd/actions/ci/aws-auth@v1
      with: {"role_arn": "${{ inputs.role_arn }}", "region": "${{ inputs.aws_region }}"}
    - uses: OsomePteLtd/actions/ci/setup-node@v1
      with:
        node_version_file: ${{ inputs.node_version_file }}
        install: ${{ inputs.lockfile_guard == 'true' && 'guard' || 'ci' }}
        github_packages_token: ${{ inputs.github_packages_token }}
        npmjs_token: ${{ inputs.npmjs_token }}
    - name: Static scripts
      shell: bash
      env: {"SCRIPTS": "${{ inputs.static_scripts }}"}
      run: |
        for s in $SCRIPTS; do
          echo "::group::npm run $s"; start=$SECONDS
          npm run "$s"
          echo "| $s | $((SECONDS-start))s |" >> "$GITHUB_STEP_SUMMARY"; echo "::endgroup::"
        done
    - name: IAM wildcards
      if: inputs.iam_check == 'true'
      uses: OsomePteLtd/actions/packages/check-iam-wildcards@v1
      with:
        project_name: ${{ github.event.repository.name }}
    - name: Serverless license
      if: inputs.serverless_license == 'true'
      shell: bash
      run: |
        LICENSE=$(aws ssm get-parameter --name '/ServerlessFramework/license' --with-decryption --query 'Parameter.Value' --output text)
        echo "::add-mask::$LICENSE"
        echo "SERVERLESS_LICENSE_KEY=$LICENSE" >> "$GITHUB_ENV"
    - name: Build bundle
      if: inputs.build_script != ''
      shell: bash
      env: {"BUILD": "${{ inputs.build_script }}"}
      run: npm run "$BUILD"
