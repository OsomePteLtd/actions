name: workflow-lint
description: actionlint (+shellcheck when present) and a third-party SHA-pin check on the caller repo's .github/.
inputs:
  actionlint_version: {"default": "1.7.12"}
  sha256_amd64: {"default": "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"}  # from v1.7.12 checksums.txt
  sha256_arm64: {"default": "325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6"}
  allow_unpinned_prefixes: {"description": "Owners allowed to use tags", "default": "OsomePteLtd/ osomepteltd/ ./ docker://"}
runs:
  using: composite
  steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with: {"persist-credentials": false}
    - name: actionlint
      shell: bash
      env:
        V: ${{ inputs.actionlint_version }}
        SUM_AMD64: ${{ inputs.sha256_amd64 }}
        SUM_ARM64: ${{ inputs.sha256_arm64 }}
      run: |
        set -euo pipefail
        arch=$(uname -m); case "$arch" in x86_64) arch=amd64 ;; aarch64|arm64) arch=arm64 ;; esac
        base="https://github.com/rhysd/actionlint/releases/download/v$V"
        tgz="actionlint_${V}_linux_${arch}.tar.gz"
        want=$SUM_AMD64; [ "$arch" = arm64 ] && want=$SUM_ARM64
        curl -sSfLO "$base/$tgz"
        echo "$want  $tgz" | sha256sum -c -   # pinned checksum, not fetched
        tar xzf "$tgz" actionlint
        # GitHub supports `concurrency.queue`; actionlint <= 1.7.12 does not (rhysd/actionlint#657, #746).
        ./actionlint -color -ignore 'unexpected key "queue" for "concurrency" section'
    - name: SHA-pin check
      shell: bash
      env: {"ALLOW": "${{ inputs.allow_unpinned_prefixes }}"}
      run: |
        set -f
        bad=0
        while IFS= read -r ref; do
          ok=false; for p in $ALLOW; do [[ $ref == "$p"* ]] && ok=true; done
          [[ $ref =~ @[0-9a-f]{40}$ ]] && ok=true
          [ "$ok" = true ] || { echo "::error::unpinned: $ref"; bad=1; }
        done < <(grep -rhoE '^\s*-?\s*uses:\s*[^ #]+' .github | sed -E 's/.*uses:\s*//' | sort -u)
        exit "$bad"
