# Backend CI skeleton. Owns order, needs/if, services, matrix, permissions,
# timeouts, runners. Steps live in ci/<stage>/action.yml. Callers pass values.
# changes -> setup -> checks + diff-check + lint (linter.yml) -> tests(N) -> coverage
#   -> deploy-trigger -> ci-status (always)
# Path rules (PRs only; every other event = full): see docs/backend-ci/README.md
name: Backend CI

on:
  workflow_call:
    inputs:
      node_version_file: {"type": "string", "default": ".nvmrc"}
      light_runner: {"type": "string", "default": "arc-runner-light"}
      heavy_runner: {"type": "string", "default": "arc-runner-heavy"}
      test_runner: {"type": "string", "default": "", "description": "Runner for tests; '' = heavy_runner (scrooge SC:123)"}
      aws_region: {"type": "string", "default": "us-east-1"}
      ci_role_arn: {"type": "string", "required": true, "description": "OIDC role for checks/tests. No default: public repo."}
      default_branch: {"type": "string", "default": "main"}
      # changes (path rules)
      code_globs: {"type": "string", "default": "", "description": "'' = ci/changes default"}
      infra_globs: {"type": "string", "default": ""}
      workflows_globs: {"type": "string", "default": ""}
      docs_globs: {"type": "string", "default": ""}
      terraform_dirs: {"type": "string", "default": "", "description": "'' = auto-discover *.tf"}
      pr_lint: {"type": "boolean", "default": false, "description": "Run pr-lint inside CI (repos keep their own pr-lint for edited/labeled events)"}
      # setup
      with_transient: {"type": "boolean", "default": false}
      combine_dependabot: {"type": "boolean", "default": false}
      # checks
      static_scripts: {"type": "string", "required": true, "description": "Whitespace-separated npm scripts"}
      build_script: {"type": "string", "default": "build"}
      lockfile_guard: {"type": "boolean", "default": true}
      iam_check: {"type": "boolean", "default": true}
      migration_guard: {"type": "boolean", "default": true}
      serverless_license: {"type": "boolean", "default": true}
      # diff-check
      diff_max_lines: {"type": "number", "default": 0, "description": "0 = off"}
      diff_skip_label: {"type": "string", "default": "allow-large-diff"}
      diff_ignore_globs: {"type": "string", "default": "package-lock.json **/__snapshots__/** **/*.snap", "description": "pathspecs not counted"}
      # tests
      shards: {"type": "number", "default": 1}
      migrate_script: {"type": "string", "default": "db:migrate:test"}
      test_script: {"type": "string", "default": "test:ci"}
      registry: {"type": "string", "default": "osomecache.azurecr.io"}
      postgres_image: {"type": "string", "default": "postgres:16.11"}
      redis_image: {"type": "string", "default": "redis:7.0.7"}
      db_name: {"type": "string", "default": "", "description": "default <repo>-test"}
      # coverage
      coverage: {"type": "boolean", "default": true}
    secrets:
      OSOME_BOT_TOKEN: {"required": true}
      NPMJS_KEY_READ_ONLY: {"required": true}
      DOCKER_CACHE_USER: {"required": true}
      DOCKER_CACHE_PASSWORD: {"required": true}
    outputs:
      stages: {"value": "${{ jobs.setup.outputs.stages }}"}
      run_checks: {"value": "${{ jobs.setup.outputs.run_checks }}"}

# PRs: superseded runs cancelled. Tags/main/dispatch: keyed by run_id, never cancelled.
concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  changes:
    name: Changes
    runs-on: ${{ inputs.light_runner }}
    timeout-minutes: 5
    permissions: {"contents": "read"}
    outputs:
      code: ${{ steps.c.outputs.code }}
      infra: ${{ steps.c.outputs.infra }}
      workflows: ${{ steps.c.outputs.workflows }}
      docs: ${{ steps.c.outputs.docs }}
    steps:
      - id: c
        uses: OsomePteLtd/actions/ci/changes@master
        with:
          # '' -> the action's built-in default
          code_globs: ${{ inputs.code_globs }}
          infra_globs: ${{ inputs.infra_globs }}
          workflows_globs: ${{ inputs.workflows_globs }}
          docs_globs: ${{ inputs.docs_globs }}

  setup:
    name: Set up
    runs-on: ${{ inputs.light_runner }}
    timeout-minutes: 5
    permissions: {"contents": "read"}
    outputs:
      stages: ${{ steps.s.outputs.stages }}
      run_checks: ${{ steps.s.outputs.run_checks }}
      shard_list: ${{ steps.s.outputs.shard_list }}
    steps:
      - id: s
        uses: OsomePteLtd/actions/ci/setup@master
        with:
          with_transient: ${{ inputs.with_transient }}
          combine_dependabot: ${{ inputs.combine_dependabot }}
          node_version_file: ${{ inputs.node_version_file }}
          shards: ${{ inputs.shards }}
          default_branch: ${{ inputs.default_branch }}
          token: ${{ secrets.OSOME_BOT_TOKEN }}

  checks:
    name: Static checks
    needs: [changes, setup]
    if: needs.setup.outputs.run_checks == 'true' && (needs.changes.outputs.code == 'true' || needs.changes.outputs.workflows == 'true')
    runs-on: ${{ inputs.heavy_runner }}
    timeout-minutes: 20
    permissions: {"contents": "read", "id-token": "write", "pull-requests": "read"}
    steps:
      - uses: OsomePteLtd/actions/ci/checks@master
        with:
          static_scripts: ${{ inputs.static_scripts }}
          build_script: ${{ inputs.build_script }}
          lockfile_guard: ${{ inputs.lockfile_guard }}
          iam_check: ${{ inputs.iam_check }}
          migration_guard: ${{ inputs.migration_guard }}
          serverless_license: ${{ inputs.serverless_license }}
          role_arn: ${{ inputs.ci_role_arn }}
          aws_region: ${{ inputs.aws_region }}
          node_version_file: ${{ inputs.node_version_file }}
          github_packages_token: ${{ secrets.OSOME_BOT_TOKEN }}
          npmjs_token: ${{ secrets.NPMJS_KEY_READ_ONLY }}

  diff-check:
    name: Diff size
    needs: [changes, setup]
    if: needs.setup.outputs.run_checks == 'true' && needs.changes.outputs.code == 'true' && inputs.diff_max_lines > 0
    runs-on: ${{ inputs.light_runner }}
    timeout-minutes: 5
    permissions: {"contents": "read", "pull-requests": "read"}
    steps:
      - uses: OsomePteLtd/actions/ci/diff-check@master
        with:
          max_lines: ${{ inputs.diff_max_lines }}
          skip_label: ${{ inputs.diff_skip_label }}
          ignore_globs: ${{ inputs.diff_ignore_globs }}

  tests:
    name: Unit tests ${{ matrix.shard }}/${{ inputs.shards }}
    needs: [changes, setup]
    if: needs.setup.outputs.run_checks == 'true' && needs.changes.outputs.code == 'true'
    runs-on: ${{ inputs.test_runner || inputs.heavy_runner }}
    timeout-minutes: 30
    permissions: {"contents": "read", "id-token": "write"}
    env:
      STAGE: test # SV:133, SC:131
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.setup.outputs.shard_list) }}
    services:
      postgres:
        image: ${{ inputs.registry }}/${{ inputs.postgres_image }}
        credentials:
          username: ${{ secrets.DOCKER_CACHE_USER }}
          password: ${{ secrets.DOCKER_CACHE_PASSWORD }}
        env:
          POSTGRES_USER: user          # local test creds, same as SV:142-144
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ${{ inputs.db_name || format('{0}-test', github.event.repository.name) }}
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
      redis:
        image: ${{ inputs.registry }}/${{ inputs.redis_image }}
        credentials:
          username: ${{ secrets.DOCKER_CACHE_USER }}
          password: ${{ secrets.DOCKER_CACHE_PASSWORD }}
        ports: ['6379:6379']
    steps:
      - uses: OsomePteLtd/actions/ci/tests@master
        with:
          shard: ${{ matrix.shard }}
          shards: ${{ inputs.shards }}
          migrate_script: ${{ inputs.migrate_script }}
          test_script: ${{ inputs.test_script }}
          coverage: ${{ inputs.coverage }}
          role_arn: ${{ inputs.ci_role_arn }}
          aws_region: ${{ inputs.aws_region }}
          node_version_file: ${{ inputs.node_version_file }}
          github_packages_token: ${{ secrets.OSOME_BOT_TOKEN }}
          npmjs_token: ${{ secrets.NPMJS_KEY_READ_ONLY }}

  coverage:
    name: Report coverage
    needs: [setup, tests]
    # SV:211 skips dependabot; runs only when tests ran and passed
    if: needs.tests.result == 'success' && inputs.coverage && github.actor != 'dependabot[bot]'
    runs-on: ${{ inputs.light_runner }}
    timeout-minutes: 10
    permissions: {"contents": "read"}
    steps:
      - uses: OsomePteLtd/actions/ci/coverage@master
        with:
          node_version_file: ${{ inputs.node_version_file }}
          github_packages_token: ${{ secrets.OSOME_BOT_TOKEN }}
          npmjs_token: ${{ secrets.NPMJS_KEY_READ_ONLY }}

  lint:
    name: Lint
    needs: [changes, setup]
    if: >-
      needs.setup.outputs.run_checks == 'true' &&
      (needs.changes.outputs.workflows == 'true' || needs.changes.outputs.infra == 'true' || inputs.pr_lint)
    permissions: {"contents": "read", "pull-requests": "read"}
    uses: OsomePteLtd/actions/.github/workflows/linter.yml@master
    with:
      runner: ${{ inputs.light_runner }}
      pr_lint: ${{ inputs.pr_lint }}
      workflows: ${{ needs.changes.outputs.workflows == 'true' }}
      infra: ${{ needs.changes.outputs.infra == 'true' }}
      terraform_dirs: ${{ inputs.terraform_dirs }}

  deploy-trigger:
    name: Deploy ${{ matrix.stage.name }}
    needs: [changes, setup, checks, diff-check, tests, lint]
    # SV:261 / SC:214: deploy when stages exist and nothing failed; never on cancel or merge queue.
    # changes must succeed: if it fails, the gated jobs are skipped (not failed) and would let unchecked code deploy.
    if: >-
      !cancelled() && github.event_name != 'merge_group' && needs.changes.result == 'success' &&
      needs.setup.result == 'success' && needs.setup.outputs.stages != '[]' &&
      !contains(needs.*.result, 'failure')
    runs-on: ${{ inputs.light_runner }}
    timeout-minutes: 5
    permissions: {} # record is created with OSOME_BOT_TOKEN
    strategy:
      matrix:
        stage: ${{ fromJSON(needs.setup.outputs.stages) }}
    concurrency:
      group: deploy-record-${{ github.repository }}-${{ matrix.stage.name }}
      cancel-in-progress: false
    steps:
      - uses: OsomePteLtd/actions/ci/deploy-trigger@master
        with:
          stage: ${{ matrix.stage.name }}
          token: ${{ secrets.OSOME_BOT_TOKEN }}

  ci-status:
    name: CI status
    needs: [changes, setup, checks, diff-check, tests, coverage, lint]
    if: always()
    runs-on: ${{ inputs.light_runner }}
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: OsomePteLtd/actions/ci/status@master
        with:
          results: ${{ toJSON(needs) }}
          # gates the rules demanded; skip anywhere else = success
          required_gates: >-
            ${{ needs.setup.outputs.run_checks == 'true' && needs.changes.outputs.code == 'true' && 'checks tests' || '' }}
            ${{ needs.setup.outputs.run_checks == 'true' && needs.changes.outputs.workflows == 'true' && 'checks lint' || '' }}
            ${{ needs.setup.outputs.run_checks == 'true' && needs.changes.outputs.infra == 'true' && 'lint' || '' }}
