# Backend CI — shared workflow for Osome serverless backends.
#
# Same job graph as before, plus a `ci-status` roll-up. Rationale, the
# 18-row cut list, and example callers: docs/ci-skeleton/. Org actions are
# @master until this repo has a v1 tag.
#
# Callers should grant contents: read, id-token: write, pull-requests: read
# and pass secrets explicitly. `secrets: inherit` still works, because none
# of the declared secrets are required. setup-node caches npm downloads;
# there is no jest cache step.
name: Backend CI

on:
  workflow_call:
    inputs:
      # --- runtime hook (one composite dispatches on it) ---
      runtime:
        description: 'node | python | go | java — passed to setup-runtime'
        type: string
        default: 'node'
      version_file:
        description: 'Runtime version file (.nvmrc, .python-version, go.mod, .java-version)'
        type: string
        default: '.nvmrc'
      install_command:
        description: 'Clean install command (lockfile-strict)'
        type: string
        default: 'npm ci'
      run_prefix:
        description: 'Prefix used to run every named script (npm run | yarn run | make | poetry run)'
        type: string
        default: 'npm run'
      # --- checks / build / tests (as backend.yml) ---
      static_check_scripts:
        description: 'Whitespace-separated scripts run in order as static checks'
        type: string
        default: |
          unused-exports
          type-check
          lint
          depcheck
          type-coverage
          spell
      lockfile_check:
        description: 'Fail if a non-frozen install changes package-lock.json (node only)'
        type: boolean
        default: true
      build_script:
        description: 'Script that builds the bundle; empty skips'
        type: string
        default: 'build'
      serverless_license:
        description: 'Fetch /ServerlessFramework/license from SSM before build'
        type: boolean
        default: true
      run_iam_check:
        type: boolean
        default: true
      run_migration_guard:
        description: 'fail-on-code-and-migrations'
        type: boolean
        default: true
      test_script:
        type: string
        default: 'test:ci'
      migrate_script:
        description: 'Run before tests; empty skips'
        type: string
        default: 'db:migrate:test'
      shards:
        description: 'JSON array of shard numbers; "[1]" = single run'
        type: string
        default: '[1, 2, 3]'
      enable_sharding:
        type: boolean
        default: true
      report_coverage:
        description: 'Move per-shard coverage, upload, and run jest-coverage'
        type: boolean
        default: true
      services:
        description: 'Start postgres+redis service containers for tests'
        type: boolean
        default: true
      services_registry:
        type: string
        default: ''
      postgres_image:
        type: string
        default: 'postgres:16.11'
      redis_image:
        type: string
        default: 'redis:7.0.7'
      db_name:
        type: string
        default: 'app-test'
      run_diff_check:
        type: boolean
        default: true
      diff_check_script:
        type: string
        default: 'bin/checkBranchDiff.js'
      default_branch:
        description: 'Pushes to this branch skip the PR gates (deploy-only run)'
        type: string
        default: 'main'
      aws_region:
        type: string
        default: 'us-east-1'
      dev_role_arn:
        type: string
        default: 'arn:aws:iam::664258603548:role/github-deployer-nokms'
      light_runner:
        type: string
        default: 'arc-runner-light'
      heavy_runner:
        type: string
        default: 'arc-runner-heavy'
    # Same four secrets the previous workflow read via `secrets: inherit`.
    # required: false so an existing caller that still inherits is not rejected
    # at startup. New callers should pass them explicitly (see header).
    secrets:
      OSOME_BOT_TOKEN:
        required: false
      NPMJS_KEY_READ_ONLY:
        required: false
      DOCKER_CACHE_USER:
        required: false
      DOCKER_CACHE_PASSWORD:
        required: false
    outputs:
      stages:
        description: 'JSON deployment stages from get-deployment-stages'
        value: ${{ jobs.setup.outputs.stages }}
      run_checks:
        description: "'true' when the PR gates ran"
        value: ${{ jobs.setup.outputs.run_checks }}

# Callee-level group. github.* is the CALLER's context, so github.workflow is the
# caller's workflow name; the group stays unique per caller workflow + ref.
# PRs: superseded runs are cancelled. Everything else (tags, main, dispatch):
# never cancelled, and keyed by run_id so a queued skeleton run is never replaced
# either. This group is the skeleton run only. It does not order the app repo's
# on: deployment workflow (docs/ci-skeleton/GAPS.md).
concurrency:
  group: ci-skeleton-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  AWS_REGION: ${{ inputs.aws_region }}

jobs:
  setup:
    name: Set up
    runs-on: ${{ inputs.light_runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      stages: ${{ steps.stages.outputs.stages }}
      run_checks: ${{ steps.gate.outputs.run_checks }}
    steps:
      - name: Get deployment stages
        uses: osomepteltd/actions/packages/get-deployment-stages@master
        id: stages
        with:
          with-transient: false
      # The ONE skip guard. Exact match replaces contains(github.ref, 'refs/heads/main'),
      # which also matched branches like refs/heads/main-hotfix.
      - name: Decide whether PR gates run
        id: gate
        env:
          RUN: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref != format('refs/heads/{0}', inputs.default_branch) }}
        run: echo "run_checks=$RUN" >> "$GITHUB_OUTPUT"

  static-checks:
    name: Static checks
    if: ${{ needs.setup.outputs.run_checks == 'true' }}
    needs: setup
    runs-on: ${{ inputs.heavy_runner }}
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    steps:
      - name: Check if PR contains both code and migrations
        if: ${{ inputs.run_migration_guard }}
        uses: osomepteltd/actions/packages/fail-on-code-and-migrations@master
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6
        with:
          role-to-assume: ${{ inputs.dev_role_arn }}
          role-session-name: gha-${{ github.repository_id }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: osomepteltd/actions/packages/setup-runtime@master
        with:
          runtime: ${{ inputs.runtime }}
          version-file: ${{ inputs.version_file }}
          github-packages-token: ${{ secrets.OSOME_BOT_TOKEN }}
          npmjs-token: ${{ secrets.NPMJS_KEY_READ_ONLY }}
      - name: Install dependencies (and verify lockfile)
        env:
          INSTALL: ${{ inputs.install_command }}
          LOCKFILE_CHECK: ${{ inputs.runtime == 'node' && inputs.lockfile_check }}
        run: |
          if [ "$LOCKFILE_CHECK" = "true" ]; then
            cp package-lock.json package-lock.json.orig
            npm install
            diff --color=always package-lock.json.orig package-lock.json || { echo "::error::package-lock.json changed"; exit 1; }
          else
            $INSTALL
          fi
      - name: Run static checks
        env:
          SCRIPTS: ${{ inputs.static_check_scripts }}
          RUN_PREFIX: ${{ inputs.run_prefix }}
        run: |
          echo "$SCRIPTS" | xargs -n1 | while read -r script; do
            [ -z "$script" ] && continue
            echo "::group::$RUN_PREFIX $script"
            $RUN_PREFIX "$script"
            echo "::endgroup::"
          done
      - name: Check iam wildcards
        if: ${{ inputs.run_iam_check }}
        uses: osomepteltd/actions/packages/check-iam-wildcards@master
        with:
          project_name: '${{ github.event.repository.name }}'
      - name: Set Serverless License Key
        if: ${{ inputs.serverless_license && inputs.build_script != '' }}
        run: |
          LICENSE=$(aws ssm get-parameter --name '/ServerlessFramework/license' --with-decryption --query 'Parameter.Value' --output text)
          echo "::add-mask::$LICENSE"
          echo "SERVERLESS_LICENSE_KEY=$LICENSE" >> "$GITHUB_ENV"
      - name: Try to create a bundle
        if: ${{ inputs.build_script != '' }}
        env:
          RUN_PREFIX: ${{ inputs.run_prefix }}
          BUILD_SCRIPT: ${{ inputs.build_script }}
        run: $RUN_PREFIX "$BUILD_SCRIPT"

  diff-check:
    name: Git diff check
    if: ${{ inputs.run_diff_check && needs.setup.outputs.run_checks == 'true' }}
    needs: setup
    runs-on: ${{ inputs.light_runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check diff
        env:
          DIFF_SCRIPT: ${{ inputs.diff_check_script }}
          MAX_LINES: ${{ vars.MAX_LINES_DIFF_BACKEND || 500 }}
        run: node "$DIFF_SCRIPT" "$MAX_LINES"

  tests:
    name: Unit tests
    if: ${{ needs.setup.outputs.run_checks == 'true' }}
    needs: setup
    runs-on: ${{ inputs.heavy_runner }}
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    env:
      STAGE: test
    services:
      postgres:
        # Empty image when services is false. `&& ''` is falsy, so '' must be the
        # value returned by `&&`, not the left operand of `||`. See GAPS.md.
        image: ${{ inputs.services && (inputs.services_registry != '' && format('{0}postgres:16', inputs.services_registry) || inputs.postgres_image) || '' }}
        credentials:
          username: ${{ secrets.DOCKER_CACHE_USER }}
          password: ${{ secrets.DOCKER_CACHE_PASSWORD }}
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ${{ inputs.db_name }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: ${{ inputs.services && (inputs.services_registry != '' && format('{0}redis:7', inputs.services_registry) || inputs.redis_image) || '' }}
        credentials:
          username: ${{ secrets.DOCKER_CACHE_USER }}
          password: ${{ secrets.DOCKER_CACHE_PASSWORD }}
        ports:
          - 6379:6379
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(inputs.shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6
        with:
          role-to-assume: ${{ inputs.dev_role_arn }}
          role-session-name: gha-${{ github.repository_id }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: osomepteltd/actions/packages/setup-runtime@master
        with:
          runtime: ${{ inputs.runtime }}
          version-file: ${{ inputs.version_file }}
          github-packages-token: ${{ secrets.OSOME_BOT_TOKEN }}
          npmjs-token: ${{ secrets.NPMJS_KEY_READ_ONLY }}
      - name: Install dependencies
        env:
          INSTALL: ${{ inputs.install_command }}
        run: $INSTALL
      - name: Migrate database
        if: ${{ inputs.migrate_script != '' }}
        env:
          RUN_PREFIX: ${{ inputs.run_prefix }}
          MIGRATE_SCRIPT: ${{ inputs.migrate_script }}
        run: $RUN_PREFIX "$MIGRATE_SCRIPT"
      - name: Run unit tests
        env:
          RUN_PREFIX: ${{ inputs.run_prefix }}
          TEST_SCRIPT: ${{ inputs.test_script }}
          ENABLE_SHARDING: ${{ inputs.enable_sharding }}
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: |
          if [ "$ENABLE_SHARDING" = "true" ]; then
            $RUN_PREFIX "$TEST_SCRIPT" -- --shard="$SHARD/$SHARD_TOTAL"
          else
            $RUN_PREFIX "$TEST_SCRIPT"
          fi
      - name: Move coverage to dedicated folder
        if: ${{ inputs.report_coverage }}
        env:
          SHARD: ${{ matrix.shard }}
        run: mv coverage/coverage-final.json "coverage/$SHARD.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ inputs.report_coverage }}
        with:
          name: coverage-artifacts-${{ matrix.shard }}
          path: coverage/
          retention-days: 3
          overwrite: true

  report-coverage:
    name: Report coverage
    # jest-coverage is a bundled node24 action, so this job does not reinstall.
    # It still checks out the caller repo: the action require()s ./jest.config.js
    # from GITHUB_WORKSPACE to read coverageThreshold.
    if: ${{ inputs.report_coverage && github.actor != 'dependabot[bot]' }}
    needs: [tests]
    runs-on: ${{ inputs.light_runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-artifacts-*
          path: coverage
          merge-multiple: true
      - name: Check coverage
        uses: osomepteltd/actions/packages/jest-coverage@master
        with:
          coverage-directory: ./coverage/
          summary-destination: ./coverage/coverage-summary.json

  deploy:
    name: Deploy
    # Hands off to the repo's deployment-triggered deploy workflow by creating a GitHub
    # deployment record with OSOME_BOT_TOKEN (GITHUB_TOKEN-created events would not
    # trigger it). !cancelled() replaces always() so a cancelled run never deploys.
    needs: [setup, static-checks, tests]
    if: ${{ !cancelled() && needs.setup.result == 'success' && !contains(needs.setup.outputs.stages, '[]') && !contains(needs.*.result, 'failure') }}
    runs-on: ${{ inputs.light_runner }}
    timeout-minutes: 10
    permissions: {}
    strategy:
      matrix:
        stage: ${{ fromJson(needs.setup.outputs.stages) }}
    # One GitHub deployment *record* per env at a time, never cancelled.
    # This only serializes the bobheadxi API call. It does not decide which
    # commit the app repo's on: deployment workflow ships: those workflows call
    # packages/cancel-when-already-running, which cancels the newer run while
    # an older Deploy is in progress. See docs/ci-skeleton/GAPS.md.
    concurrency:
      group: deploy-record-${{ github.repository }}-${{ matrix.stage.name }}
      cancel-in-progress: false
    steps:
      - name: Deploy to ${{ matrix.stage.name }}
        uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8 # v1
        with:
          step: start
          token: ${{ secrets.OSOME_BOT_TOKEN }}
          env: ${{ matrix.stage.name }}
          ref: ${{ github.head_ref || github.ref_name }}
          override: true

  ci-status:
    name: CI status
    # Roll-up of setup, static-checks, diff-check, tests, and report-coverage.
    # Deploy is not included. Runs always() so it never shows as skipped: a skipped
    # required check counts as passing in branch protection. Fails when one of those
    # gates failed or was cancelled, setup did not succeed, or the core PR checks
    # did not succeed.
    if: ${{ always() }}
    needs: [setup, static-checks, diff-check, tests, report-coverage]
    runs-on: ${{ inputs.light_runner }}
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          BAD: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.setup.result != 'success' || (needs.setup.outputs.run_checks == 'true' && (needs.static-checks.result != 'success' || needs.tests.result != 'success')) }}
        run: '[ "$BAD" != "true" ]'
