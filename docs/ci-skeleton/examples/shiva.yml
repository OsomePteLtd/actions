# shiva/.github/workflows/default.yml — replaces the 275-line file.
name: CI
on:
  repository_dispatch:
    types: [deployment]
  push:
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
    inputs:
      environment: # read by get-deployment-stages (src/events/workflow_dispatch.ts:10)
        description: 'Stages'
        required: true
        default: 'stage'
permissions:
  contents: read
  id-token: write
  pull-requests: read
jobs:
  ci:
    # @master until OsomePteLtd/actions has a v1 tag. Intended pin after that is @v1.
    uses: OsomePteLtd/actions/.github/workflows/backend.yml@master
    with:
      shards: '[1, 2, 3, 4, 5, 6]'
      services_registry: osomecache.azurecr.io/
      db_name: shiva-test
      run_diff_check: false # shiva has no diff check today; enable once bin/checkBranchDiff.js is confirmed
    secrets:
      OSOME_BOT_TOKEN: ${{ secrets.OSOME_BOT_TOKEN }}
      NPMJS_KEY_READ_ONLY: ${{ secrets.NPMJS_KEY_READ_ONLY }}
      DOCKER_CACHE_USER: ${{ secrets.DOCKER_CACHE_USER }}
      DOCKER_CACHE_PASSWORD: ${{ secrets.DOCKER_CACHE_PASSWORD }}
