name: PR checks

on: # unchanged from pr-checks.yml:3-18
  repository_dispatch:
    types: [deployment]
  push:
    tags: ['v*.*.*']
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  ci:
    uses: OsomePteLtd/actions/.github/workflows/backend.yml@v1
    permissions: { contents: read, id-token: write, pull-requests: read }
    with:
      ci_role_arn: ${{ vars.CI_ROLE_ARN }}
      light_runner: arc-runner-light         # old :34
      heavy_runner: arc-runner-heavy         # old :62
      test_runner: azure-aks-medium-arm      # old :123
      static_scripts: static-checks          # old :101
      combine_dependabot: true               # old :40-48
      shards: 1
      coverage: false                        # scrooge has no coverage job today
      db_name: scrooge-test
      postgres_image: postgres:latest        # parity with old :135
      redis_image: redis:latest              # parity with old :151
      diff_max_lines: 0
    secrets:
      OSOME_BOT_TOKEN: ${{ secrets.OSOME_BOT_TOKEN }}
      NPMJS_KEY_READ_ONLY: ${{ secrets.NPMJS_KEY_READ_ONLY }}
      DOCKER_CACHE_USER: ${{ secrets.DOCKER_CACHE_USER }}
      DOCKER_CACHE_PASSWORD: ${{ secrets.DOCKER_CACHE_PASSWORD }}
