name: CI

on: # unchanged from default.yml:3-16
  repository_dispatch:
    types: [deployment]
  push:
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Stages'
        required: true
        default: 'stage'

permissions: {}

jobs:
  ci:
    uses: OsomePteLtd/actions/.github/workflows/backend.yml@master
    permissions: { contents: read, id-token: write, pull-requests: read }
    with:
      ci_role_arn: ${{ vars.CI_ROLE_ARN }}
      light_runner: azure-aks-medium-arm   # old default.yml uses arm for every job
      heavy_runner: azure-aks-medium-arm
      static_scripts: unused-exports type-check lint depcheck type-coverage spell  # old :89-105
      shards: 6                            # old :163
      db_name: shiva-test
      postgres_image: postgres:latest      # parity with old :137; pin later
      redis_image: redis:latest            # parity with old :153
      diff_max_lines: 0                    # off until decided
    secrets:
      OSOME_BOT_TOKEN: ${{ secrets.OSOME_BOT_TOKEN }}
      NPMJS_KEY_READ_ONLY: ${{ secrets.NPMJS_KEY_READ_ONLY }}
      DOCKER_CACHE_USER: ${{ secrets.DOCKER_CACHE_USER }}
      DOCKER_CACHE_PASSWORD: ${{ secrets.DOCKER_CACHE_PASSWORD }}
